<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project Detail | Kanghyeon</title>
    <meta name="description" content="Portfolio project detail page." />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="header-nav">
        <a class="brand" href="./index.html#top" aria-label="Go to home">kanghyeon</a>
        <ul class="nav-links">
          <li><a href="./index.html#live">live</a></li>
          <li><a href="./index.html#projects">projects</a></li>
          <li><a href="./index.html#experience">experience</a></li>
          <li><a href="./index.html#education">education</a></li>
          <li><a href="./index.html#contact">contact</a></li>
        </ul>
      </nav>
    </header>

    <main class="detail-shell">
      <a class="back-link" href="./index.html#projects">Back to projects</a>

      <section class="detail-hero">
        <div>
          <p class="eyebrow" id="project-category">Project</p>
          <h1 id="project-title">Project detail</h1>
          <p class="hero-summary" id="project-summary"></p>
          <div class="detail-actions" id="project-actions"></div>
        </div>
        <div class="detail-thumb" id="project-thumb" aria-hidden="true"></div>
      </section>

      <section class="detail-grid">
        <article class="detail-panel">
          <p class="eyebrow">Overview</p>
          <div class="rich-copy" id="project-overview"></div>
        </article>

        <article class="detail-panel">
          <p class="eyebrow">Stack</p>
          <ul class="tag-list detail-tags" id="project-stack"></ul>
        </article>

        <article class="detail-panel project-content" id="project-content"></article>
      </section>
    </main>

    <script src="./project-detail.js"></script>
  </body>
</html>
